# Generates Go code for Axon Server's DCB event store API.
# Run `go generate ./...` from the repository root to regenerate.
version: v2

inputs:
  # Tag axon-server-api-2026.1.0, the last release under the Apache License 2.0
  # (see LICENSE.txt in this folder). Later versions are under the Axoniq Terms
  # of Service, so check their license before updating.
  - git_repo: https://github.com/AxonIQ/axon-server-api.git
    commit: a5b22b33408ce9ae0282c61be889250a85345438
    subdir: src/main/proto
    paths:
      - common.proto
      - dcb.proto

# The Axon protos only declare Java options, so we set the Go package here.
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/ayberkyonar/axonscope/internal/eventstore/internal/axonpb

plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: .
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: .
    opt: paths=source_relative
